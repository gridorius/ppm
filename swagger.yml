openapi: 3.0.3
info:
  title: Swagger
  contact:
    email: gridorius@yandex.ru
  version: 1.0.11
externalDocs:
  description: Find out more about Swagger
  url: https://swagger.io
tags:
  - name: auth
    description: Authorization
    externalDocs:
      description: Find out more
      url: https://swagger.io
  - name: packages
    description: Packages operations
    externalDocs:
      description: Find out more
      url: https://swagger.io
paths:
  /auth:
    post:
      tags:
        - auth
      summary: Authorization
      operationId: auth
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserAuth'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /catalog:
    get:
      security:
        - auth: [ ]
      tags:
        - packages
      summary: Package list
      operationId: catalog
      responses:
        '200':
          description: Packages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/catalogResponse'
        '401':
          $ref: '#/components/responses/error'
        '403':
          $ref: '#/components/responses/error'
  /catalog/upload:
    post:
      security:
        - auth: [ ]
      tags:
        - packages
      summary: Upload package
      operationId: upload
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                package:
                  type: string
                  format: binary
      responses:
        '200':
          $ref: '#/components/responses/empty'
        '400':
          $ref: '#/components/responses/error'
        '401':
          $ref: '#/components/responses/error'
        '403':
          $ref: '#/components/responses/error'
  /catalog/download:
    post:
      tags:
        - packages
      security:
        - auth: [ ]
      summary: Download package
      operationId: download
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/packagesRequest'
      responses:
        '200':
          description: Successful operation
          content:
            application/x-tar.:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/error'
        '401':
          $ref: '#/components/responses/error'
        '403':
          $ref: '#/components/responses/error'
        '404':
          $ref: '#/components/responses/error'
components:
  securitySchemes:
    auth:
      type: http
      scheme: bearer
  schemas:
    packagesRequest:
      type: array
      items:
        type: string
        pattern: "name_version"
    packagesResponse:
      type: array
      items:
        type: object
        properties:
          package:
            type: string
            pattern: "name_version"
          exists:
            type: boolean
    catalogResponse:
      type: object
      properties:
        packages:
          type: object
          properties:
            name:
              type: array
              minItems: 1
              items:
                type: string
                pattern: version

        depends:
          type: object
          properties:
            name:
              type: object
              properties:
                version:
                  type: object
                  properties:
                    name:
                      type: string
                      pattern: version

    UserAuth:
      type: object
      properties:
        login:
          type: string
        password:
          type: string
    Error:
      type: object
      properties:
        error:
          type: string
    Package:
      type: object
      properties:
        name:
          type: string
        version:
          type: string
        depends:
          type: object
  responses:
    empty:
      description: Empty
    error:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'


